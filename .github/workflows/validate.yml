name: Validate research workspace

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database tests use only this disposable service; optional live tests stay disabled.
      # Never make a production database or provider key available to PR code.
      DATABASE_URL: postgresql://fixture:fixture@127.0.0.1:5432/fixture
      PORT: "19817"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check workspace types
        run: pnpm run typecheck
      - name: Initialize the isolated test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector'
          pnpm --filter @workspace/db run push
          # drizzle-kit can report DDL errors without a nonzero exit status.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'SELECT 1 FROM research_studio_items LIMIT 1; SELECT 1 FROM research_evidence_chunks LIMIT 1;'
      - name: Run deterministic research and export tests
        run: pnpm --filter @workspace/api-server test
      - name: Build the API server
        run: pnpm --filter @workspace/api-server run build
      - name: Build the web app
        run: pnpm --filter @workspace/evidora run build
