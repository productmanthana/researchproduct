kind = "web"
previewPath = "/"
title = "litvo.ai"
description = "litvo.ai is an evidence-first research workspace for scholarly discovery, private projects, cited answers, literature reviews, manuscripts, thesis writing and paper review."
version = "1.0.0"
id = "artifacts/evidora"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19817

[services.development]
run = "pnpm --filter @workspace/evidora run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/evidora", "run", "build" ]
serve = "static"
publicDir = "artifacts/evidora/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19817"
BASE_PATH = "/"
